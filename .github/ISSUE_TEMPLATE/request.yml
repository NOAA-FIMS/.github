name: Bug or request
description: Report a bug or suggest changes
labels: ["status: triage_needed"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out this issue! By 
        submitting this issue, you agree to follow our 
        [Code of Conduct](https://github.com/NOAA-FIMS/.github/blob/main/CODE_OF_CONDUCT.md).

        ---

        Before filling out this report please search the existing issues to see
        if the problem has already been reported. If it has, please add a
        comment to the open issue or link to the related, but closed, issue in
        this report. Also, please select the appropriate Issue type, e.g., Bug
        if this is in fact a bug, if you have access to this repository; if you
        do not have the ability to select a type we are happy to do it for you.
  - type: textarea
    id: description
    attributes:
      label: Describe the problem, idea, or request that you have and, if possible, provide a solution.
      description: |
        Provide (1) a description of the bug, a new feature, or change to a
        current feature; (2) the problem that led to you thinking you should
        submit an issue; and (3) a proposed solution. Please include a minimal
        reproducible example (i.e., a
        [reprex](https://reprex.tidyverse.org/articles/reprex-dos-and-donts.html)).
        If you have not heard of a [reprex](http://reprex.tidyverse.org/)
        before, you can start by reading about them on the [tidyverse
        blog](https://www.tidyverse.org/help/#reprex).
      placeholder: |
        I would like <x> because I am frustrated when <y> happens and this
        could be fixed by <z>.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: |
        Add any other context or screenshots here.
        For example, is the feature necessary to satisfy the Terms of Reference
        for your fishery management body, please explain why and list the
        relevant management body. Or, are there alternative solutions that
        exist, if so please provide them here.
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Which OS are you seeing the problem on?
      multiple: true
      options:
        - Windows
        - Mac
        - Linux
        - Other
    validations: 
      required: false
  - type: input
    id: version
    attributes:
      label: Which version of this package are you seeing the problem on?
      description: |
        You can get the version number of package from your R
        session using `packageVersion("MyPackage")`. If a version number is not
        relevant, perhaps provide a commit hash that is relevant.
    validations:
      required: false
